name: Sport80 check (events, rankings and adaptive list, daily)

# Runs on GitHub's servers so the daily Claude update doesn't need a laptop to be awake.
# 09:07 UTC = 2:07 AM PDT / 1:07 AM PST. GitHub has been starting scheduled runs
# 4-6 hours late, so this leaves room before the Claude update at 10:51 AM Pacific.
# (Keep it after midnight Pacific: the status file and rankings "updated" use the Pacific date.)
on:
  schedule:
    - cron: '7 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sport80
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless browser
        run: |
          npm i --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Read Sport80
        id: run
        continue-on-error: true
        run: node scripts/cloud/sport80.mjs --rankings
      - name: Rebuild draft pages data
        id: features
        continue-on-error: true
        run: python3 scripts/features/build.py
      - name: Publish changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sport80-events.json data/cloud-status.json data/rankings.json data/adaptive.json data/referees.json data/new-pages.json data/history
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Sport80 check $(TZ=America/Los_Angeles date +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
      - name: Flag listings that dropped out of Sport80
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/new-unlisted.txt
          import json
          st = json.load(open('data/cloud-status.json')).get('events') or {}
          new = set(st.get('newlyUnlisted') or [])
          for e in json.load(open('data/sport80-events.json')).get('unlisted', []):
              if e['id'] in new:
                  page = {True: 'its event page still loads' + (f", registration closes {e['registrationClose']}" if e.get('registrationClose') else ''),
                          False: 'its event page is GONE (likely cancelled)'}.get(e.get('pageLive'), "its event page couldn't be checked")
                  print(f"{e['name']} ({e['start']}, {e['city']}, {e['state']})\t{page}\t{e['eventPage']}")
          PY
          while IFS=$'\t' read -r name page url; do
            [ -z "$name" ] && continue
            title="Sport80 listing disappeared: $name"
            if gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length' | grep -qx 0; then
              gh issue create --title "$title" --body "$(printf '%s dropped out of Sport80'"'"'s public list before it happened; %s.\n\nEvent page: %s\n\nThe calendar keeps it listed (the daily update never removes events on its own). If it was cancelled, remove the row from index.html or ask Claude to. Close this issue when handled.' "$name" "$page" "$url")"
            fi
          done < /tmp/new-unlisted.txt
      - name: Report a failed check
        if: steps.run.outcome == 'failure' || steps.features.outcome == 'failure'
        run: |
          cat data/cloud-status.json
          echo "::error::Part of the Sport80 check failed; see data/cloud-status.json"
          exit 1
