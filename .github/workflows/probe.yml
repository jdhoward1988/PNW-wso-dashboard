name: probe (one-off check)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --no-package-lock playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/cloud/probe.mjs > /tmp/probe-result.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-tmp && git rm -rqf . && cp /tmp/probe-result.json . && git add probe-result.json
          git commit -qm "probe result" && git push -f origin probe-tmp:probe-output
