name: one-off - copy web fonts into the site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          mkdir -p /tmp/f && cd /tmp/f && npm i --no-save @fontsource/poppins@5 @fontsource/inter@5 @fontsource/ibm-plex-mono@5
          D=$GITHUB_WORKSPACE/assets/fonts; mkdir -p $D
          for w in 500 600 700 800; do cp node_modules/@fontsource/poppins/files/poppins-latin-$w-normal.woff2 $D/; done
          for w in 400 500 600; do cp node_modules/@fontsource/inter/files/inter-latin-$w-normal.woff2 $D/; done
          for w in 400 500 600; do cp node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-$w-normal.woff2 $D/; done
          cp node_modules/@fontsource/poppins/LICENSE $D/LICENSE-poppins.txt; cp node_modules/@fontsource/inter/LICENSE $D/LICENSE-inter.txt; cp node_modules/@fontsource/ibm-plex-mono/LICENSE $D/LICENSE-ibm-plex-mono.txt
          ls -la $D
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fonts && git commit -m "Add self-hosted web fonts (Poppins, Inter, IBM Plex Mono; OFL)" && git pull --rebase -q origin main && git push -q origin HEAD:main
